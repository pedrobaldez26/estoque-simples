<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estoque{% endblock %} · Estoque Simples</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('inventory.products') }}">Estoque Simples</a>
  {% if g.user %}
    <a href="{{ url_for('inventory.products') }}">Produtos</a>
    <a href="{{ url_for('inventory.low_stock') }}">Estoque baixo</a>
    <a href="{{ url_for('inventory.export_csv') }}">Exportar CSV</a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="link">Sair ({{ g.user.username }})</button>
    </form>
  {% endif %}
</nav>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
